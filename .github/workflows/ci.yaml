name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Check for Go files
        id: check
        run: |
          if find . -name "*.go" -not -path "./vendor/*" | grep -q .; then
            echo "has_go=true" >> $GITHUB_OUTPUT
          else
            echo "has_go=false" >> $GITHUB_OUTPUT
            echo "No Go files found — skipping lint"
          fi
      - uses: golangci/golangci-lint-action@v6
        if: steps.check.outputs.has_go == 'true'

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Check for Go files
        id: check
        run: |
          if find . -name "*.go" -not -path "./vendor/*" | grep -q .; then
            echo "has_go=true" >> $GITHUB_OUTPUT
          else
            echo "has_go=false" >> $GITHUB_OUTPUT
            echo "No Go files found — skipping tests"
          fi
      - run: go mod download
        if: steps.check.outputs.has_go == 'true'
      - run: go test -race ./...
        if: steps.check.outputs.has_go == 'true'

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}